[project]
name = "bird_api"
version = "0.1.0"
description = "API that is used to clasify bird types"
readme = "README.md"
authors = [
    { name = "Jakub Ziebinski", email = "jakubziebinski@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.1",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.17.0",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
bird_api = "bird_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "ruff==0.16.7",
]
